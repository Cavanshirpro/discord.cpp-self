name: publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.2.1
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  packages:
    uses: ./.github/workflows/packages.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  release:
    needs: [build, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate tag and metadata
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/check_release.py
          python - <<'PY'
          import json, os, subprocess
          meta = json.load(open('release.json'))
          assert meta['tag'] == os.environ['REQUESTED_TAG'], 'Tag differs from release.json'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD']).strip() == subprocess.check_output(['git', 'rev-parse', meta['tag'] + '^{commit}']).strip(), 'Tag points to another commit'
          PY
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: build/dist
      - uses: actions/download-artifact@v8
        with:
          pattern: msys2-*
          merge-multiple: true
          path: build/dist
      - run: python scripts/make_vcpkg_overlay.py
      - run: python scripts/make_msys2_recipe.py
      - name: Verify archives and finalize checksums
        run: |
          cmp release.md build/dist/release.md
          python scripts/check_release.py --archive build/dist/discord.cpp-self-$(python -c 'import json; print(json.load(open("release.json"))["tag"])').tar.gz
          cd build/dist
          sha256sum *.tar.gz *.zip *.pkg.tar.zst release.md > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(python -c 'import json; print(json.load(open("release.json"))["tag"])')
          prerelease=$(python -c 'import json; print(str(json.load(open("release.json"))["prerelease"]).lower())')
          flags=()
          if [ "$prerelease" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            python -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "A published release will not be overwritten"' "$RUNNER_TEMP/existing-release.json"
            gh release upload "$tag" build/dist/* --clobber
            gh release edit "$tag" --title "discord.cpp-self $tag" --notes-file release.md \
              --draft=false --prerelease="$prerelease" --latest="$([ "$prerelease" = true ] && echo false || echo true)"
          else
            gh release create "$tag" --verify-tag --title "discord.cpp-self $tag" \
              --notes-file release.md "${flags[@]}" build/dist/*
          fi

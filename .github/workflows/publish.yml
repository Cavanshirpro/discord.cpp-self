name: publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.1
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  packages:
    uses: ./.github/workflows/packages.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  release:
    needs: [build, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate tag and metadata
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/check_release.py
          python - <<'PY'
          import json, os, subprocess
          meta = json.load(open('release.json'))
          assert meta['tag'] == os.environ['REQUESTED_TAG'], 'Tag differs from release.json'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD']).strip() == subprocess.check_output(['git', 'rev-parse', meta['tag'] + '^{commit}']).strip(), 'Tag points to another commit'
          PY
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: build/dist
      - run: python scripts/make_vcpkg_overlay.py
      - name: Verify archives and finalize checksums
        run: |
          python scripts/check_release.py --archive build/dist/discord.cpp-self-$(python -c 'import json; print(json.load(open("release.json"))["tag"])').tar.gz
          cd build/dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(python -c 'import json; print(json.load(open("release.json"))["tag"])')
          prerelease=$(python -c 'import json; print(str(json.load(open("release.json"))["prerelease"]).lower())')
          flags=()
          if [ "$prerelease" = true ]; then flags+=(--prerelease); fi
          gh release create "$tag" --verify-tag --title "discord.cpp-self $tag" \
            --notes-file "docs/releases/${tag#v}.md" "${flags[@]}" build/dist/*

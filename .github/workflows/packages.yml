# SPDX-License-Identifier: LGPL-3.0-or-later
name: packages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  conan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shared: ['False', 'True']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build autoconf automake libtool pkg-config
      - run: python -m pip install 'conan==2.33.0'
      - run: conan profile detect
      - name: Build package and run consumer
        run: conan create . --build=missing -s compiler.cppstd=20 -o '&:shared=${{ matrix.shared }}' -c tools.cmake.cmaketoolchain:generator=Ninja -c tools.build:jobs=2
  vcpkg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/make_vcpkg_overlay.py
      - name: Install overlay and run consumer
        env:
          VCPKG_BINARY_SOURCES: clear
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install discord-cpp-self:x64-linux --overlay-ports="$PWD/build/vcpkg-overlay"
          cmake -S tests/consumer -B build/vcpkg-consumer -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=x64-linux
          cmake --build build/vcpkg-consumer
          build/vcpkg-consumer/consumer

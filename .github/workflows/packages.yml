name: packages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  conan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shared: ['False', 'True']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build autoconf automake libtool pkg-config
      - run: python -m pip install 'conan==2.33.0'
      - run: conan profile detect
      - name: Build package and run consumer
        run: conan create . --build=missing -s compiler.cppstd=20 -o '&:shared=${{ matrix.shared }}' -c tools.cmake.cmaketoolchain:generator=Ninja -c tools.build:jobs=2
  vcpkg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/make_vcpkg_overlay.py
      - name: Install overlay and run consumer
        env:
          VCPKG_BINARY_SOURCES: clear
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install discord-cpp-self:x64-linux --overlay-ports="$PWD/build/vcpkg-overlay"
          cmake -S tests/consumer -B build/vcpkg-consumer -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=x64-linux
          cmake --build build/vcpkg-consumer
          build/vcpkg-consumer/consumer
  msys2:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            arch: mingw64
            prefix: mingw-w64-x86_64
          - msystem: UCRT64
            arch: ucrt64
            prefix: mingw-w64-ucrt-x86_64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git base-devel
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-curl
            ${{ matrix.prefix }}-nlohmann-json
            ${{ matrix.prefix }}-zlib
            ${{ matrix.prefix }}-python
      - run: python scripts/make_msys2_recipe.py
      - name: Build, test and install MSYS2 package
        env:
          MINGW_ARCH: ${{ matrix.arch }}
        run: |
          cd build/msys2/mingw-w64-discord-cpp-self
          makepkg-mingw --syncdeps --cleanbuild --force --noconfirm
          pacman -U --noconfirm ./*.pkg.tar.zst
      - name: Installed package consumer
        run: |
          cmake -S tests/consumer -B build/msys2-consumer -G Ninja
          cmake --build build/msys2-consumer
          build/msys2-consumer/consumer.exe
      - uses: actions/upload-artifact@v7
        with:
          name: msys2-${{ matrix.msystem }}
          path: build/msys2/mingw-w64-discord-cpp-self/*.pkg.tar.zst
